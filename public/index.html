<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf6">
<title>爸爸想吃什麼？</title>
<style>
:root{--bg:#fffaf6;--card:#fff;--ink:#29231f;--muted:#7d716a;--line:#eadfd7;--accent:#c25742;--soft:#f6ebe3;--yes:#e8f5e9;--maybe:#fff3d9;--no:#f7e7e7;--shadow:0 16px 42px rgba(69,45,34,.10)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}button,input{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:90px}header{padding:18px}.titlerow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.title{font-size:28px;font-weight:850}#restSelect{flex:1;min-width:150px;width:auto;padding:10px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:15px}.filters{display:flex;gap:8px;overflow:auto;padding:0 18px 12px;scrollbar-width:none}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;white-space:nowrap}.chip.active{background:var(--accent);border-color:var(--accent);color:white}.panel{display:none}.panel.active{display:block}.hero-wrap{padding:0 14px}.hero{background:white;border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}.hero-photo{aspect-ratio:4/3;background:var(--soft);display:grid;place-items:center;font-size:70px;overflow:hidden}.hero-photo img{width:100%;height:100%;object-fit:cover}.missing{padding:20px;text-align:center;color:var(--muted);font-size:14px}.body{padding:16px}.name{font-size:25px;font-weight:850}.rest{color:var(--muted);margin-top:3px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.tag{background:var(--soft);border-radius:999px;padding:5px 8px;font-size:12px}.reacts,.mini-reacts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.reacts button{border:0;border-radius:15px;padding:14px 4px;font-weight:750}.yes{background:var(--yes)!important}.maybe{background:var(--maybe)!important}.no{background:var(--no)!important}.navrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.navrow button{border:1px solid var(--line);background:white;border-radius:13px;padding:11px}.swipe{text-align:center;color:var(--muted);font-size:12px;padding:10px}.section{padding:12px 18px 20px}.section h2{font-size:19px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden}.photo{aspect-ratio:1.15/1;background:var(--soft);display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.cbody{padding:10px}.cname{font-weight:800}.crest{font-size:11px;color:var(--muted);margin-top:2px}.mini-reacts button{border:0;border-radius:9px;padding:8px 2px;font-size:11px}.sentinel{text-align:center;color:var(--muted);padding:18px;grid-column:1/-1;font-size:12px}.form,.history{background:white;border:1px solid var(--line);border-radius:18px;padding:15px}label{display:block;font-size:13px;font-weight:750;margin:13px 0 6px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.picker{display:flex;gap:7px;flex-wrap:wrap}.picker label{margin:0;font-weight:400}.picker input{display:none}.picker span{display:block;border:1px solid var(--line);padding:8px 10px;border-radius:999px;font-size:13px}.picker input:checked+span{background:var(--ink);color:white}label.inline{display:flex;align-items:center;gap:7px;font-weight:400;font-size:13px;color:var(--muted);margin:9px 0 0}label.inline input{width:auto;margin:0}.preview{display:none;aspect-ratio:4/3;border-radius:15px;overflow:hidden;margin-top:10px;background:var(--soft)}.preview img{width:100%;height:100%;object-fit:cover}.primary{width:100%;border:0;border-radius:13px;background:var(--accent);color:white;padding:13px;margin-top:16px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{text-align:center;background:white;border:1px solid var(--line);border-radius:13px;padding:10px}.stat b{display:block;font-size:21px}.history-item{padding:11px 0;border-bottom:1px solid var(--line)}.history-item:last-child{border:0}.history-top{display:flex;justify-content:space-between;gap:8px}.small{font-size:12px;color:var(--muted)}.bottom{position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid var(--line)}.bottom>div{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.tab{border:0;background:white;padding:14px 8px;color:var(--muted)}.tab.active{color:var(--accent);font-weight:800}.error{background:#fff0f0;border:1px solid #efcccc;color:#7f3434;padding:10px;border-radius:12px;margin-bottom:10px}.help{font-size:13px;color:var(--muted);line-height:1.45;margin-bottom:10px}.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,14px);background:rgba(41,35,31,.94);color:#fff;padding:13px 20px;border-radius:999px;font-weight:750;font-size:16px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;max-width:88vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:50;place-items:center;padding:24px}.overlay.show{display:grid}.loginbox{background:white;border:1px solid var(--line);border-radius:22px;padding:22px;width:100%;max-width:340px;box-shadow:var(--shadow)}@media(max-width:420px){.title{font-size:25px}.name{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<header><div class="titlerow"><div class="title">爸爸想吃什麼？</div><select id="restSelect" aria-label="選餐廳"><option value="">全部餐廳</option></select></div></header>
<section id="dad" class="panel active"><div id="filters" class="filters"></div><div class="hero-wrap"><div id="hero"></div></div><div class="section"><h2>也可以看看</h2><div id="feed" class="grid"></div></div></section>
<section id="add" class="panel"><div class="section"><div class="stats"><div class="stat"><b id="sw">0</b><span class="small">最近想吃</span></div><div class="stat"><b id="sm">0</b><span class="small">最近可以</span></div><div class="stat"><b id="sn">0</b><span class="small">最近不想</span></div></div><div class="help">照片會壓縮後直接存進 D1 資料庫（免費方案 500MB，大約可放一千多張）。</div><div id="formError"></div><form id="form" class="form"><label>食物照片（必填）</label><input id="photo" type="file" accept="image/*" capture="environment" required><div id="preview" class="preview"><img id="previewImg" alt="預覽"></div><label>料理名稱</label><input id="foodName" required placeholder="例如：豆花"><label>餐廳 / 來源</label><input id="restaurant" placeholder="例如：秀蘭小館"><label>分類</label><div id="picker" class="picker"></div><button class="primary" type="submit">加入爸爸的食物</button></form><h2 style="margin-top:22px">補照片 / 換照片</h2><div class="form"><label>選一道料理</label><select id="existingId"><option value="">載入中…</option></select><label class="inline"><input type="checkbox" id="showAll"><span>也顯示已經有照片的料理（換照片）</span></label><label>照片</label><input id="existingPhoto" type="file" accept="image/*"><div id="existingPreview" class="preview"><img id="existingPreviewImg" alt="預覽"></div><button id="updatePhoto" class="primary" type="button">存入照片</button></div></div></section>
<section id="history" class="panel"><div class="section"><h2>偏好紀錄</h2><div id="historyBox" class="history"></div></div></section>
</div>
<div id="loginOverlay" class="overlay"><form id="loginForm" class="loginbox"><div class="title" style="font-size:22px">爸爸想吃什麼？</div><div class="help" style="margin:8px 0 0">請輸入密碼</div><input id="password" type="password" autocomplete="current-password" required><div id="loginError"></div><button class="primary" type="submit">進入</button></form></div>
<div id="toast" class="toast"></div>
<nav class="bottom"><div><button class="tab active" data-tab="dad">🍽️ 看食物</button><button class="tab" data-tab="add">➕ 加照片</button><button class="tab" data-tab="history">❤️ 偏好</button></div></nav>
<script>
const CATS=['全部','早餐','午餐','晚餐','點心','甜食','高蛋白','纖維','軟質','湯品','海鮮','冷食'];
const state={items:[],nextCursor:null,loading:false,filter:'全部',restaurant:'',current:0,done:false};
const reactionLabel={want:'😍 想吃',maybe:'🙂 可以',no:'🙅 不想吃'};
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function photoBlock(item,cls,eager=false){if(!item.has_photo)return `<div class="${cls}"><div class="missing">📷<br>還沒有照片<br><span class="small">料理 ID ${item.id}</span></div></div>`;return `<div class="${cls}"><img src="${item.image_url}" alt="${escapeHtml(item.name)}" loading="${eager?'eager':'lazy'}" decoding="async"></div>`}
async function api(url,options){const r=await fetch(url,options);if(r.status===401&&!String(url).endsWith('/api/login')){showLogin();throw new Error('請先輸入密碼')}if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.error||`HTTP ${r.status}`)}return r.headers.get('content-type')?.includes('application/json')?r.json():r}
function showLogin(){loginOverlay.classList.add('show');password.focus()}
loginForm.onsubmit=async e=>{e.preventDefault();loginError.innerHTML='';try{await api('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:password.value})});password.value='';loginOverlay.classList.remove('show');await reset('全部');loadNeedsPhoto();loadRestaurants()}catch(err){loginError.innerHTML=`<div class="error" style="margin-top:10px">${escapeHtml(err.message)}</div>`}};
function renderFilters(){filters.innerHTML=CATS.map(c=>`<button class="chip ${c===state.filter?'active':''}" data-c="${c}">${c}</button>`).join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>reset(b.dataset.c))}
async function reset(cat='全部'){state.filter=cat;state.items=[];state.nextCursor=null;state.current=0;state.done=false;renderFilters();feed.innerHTML='';hero.innerHTML='<div class="missing">載入中…</div>';await loadMore();renderAll()}
async function loadMore(){if(state.loading||state.done)return;state.loading=true;try{const p=new URLSearchParams({limit:'10'});if(state.filter!=='全部')p.set('category',state.filter);if(state.restaurant)p.set('restaurant',state.restaurant);if(state.nextCursor)p.set('cursor',state.nextCursor);const d=await api('/api/foods?'+p);state.items.push(...d.items);state.nextCursor=d.nextCursor;state.done=!d.nextCursor}catch(e){feed.innerHTML=loginOverlay.classList.contains('show')?'':`<div class="sentinel">${escapeHtml(e.message)}</div>`}finally{state.loading=false}}
let toastTimer;function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
async function react(id,reaction){const item=state.items.find(x=>x.id===id);try{await api(`/api/foods/${id}/reactions`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({reaction})})}catch(e){showToast('沒有記錄成功，請再試一次');return}if(item)item.latest_reaction=reaction;showToast(`${item?item.name+'：':''}${reactionLabel[reaction]}　已記錄 ✓`);renderHero();loadStats();if(document.getElementById('history').classList.contains('active'))loadHistory()}
function renderHero(){if(!state.items.length){hero.innerHTML='<div class="missing">這個條件下還沒有料理。</div>';return}if(state.current>=state.items.length)state.current=0;const x=state.items[state.current];hero.innerHTML=`<article class="hero">${photoBlock(x,'hero-photo',true)}<div class="body"><div class="name">${escapeHtml(x.name)}</div><div class="rest">${escapeHtml(x.restaurant||'家裡 / 其他')} · ID ${x.id}</div><div class="tags">${x.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div><div class="reacts"><button class="yes" data-r="want">😍 想吃</button><button class="maybe" data-r="maybe">🙂 可以</button><button class="no" data-r="no">🙅 不想吃</button></div><div class="navrow"><button id="prev">← 上一個</button><button id="next">下一個 →</button></div>${x.latest_reaction?`<div class="small" style="margin-top:9px">上次：${reactionLabel[x.latest_reaction]}</div>`:''}</div></article><div class="swipe">← 左右滑動看上一個 / 下一個 →</div>`;hero.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>react(x.id,b.dataset.r));prev.onclick=()=>{state.current=(state.current-1+state.items.length)%state.items.length;renderHero()};next.onclick=async()=>{if(state.current>=state.items.length-2&&!state.done)await loadMore();state.current=(state.current+1)%state.items.length;renderAll()}}
function renderFeed(){feed.innerHTML=state.items.map((x,i)=>`<article class="card" data-index="${i}">${photoBlock(x,'photo')}<div class="cbody"><div class="cname">${escapeHtml(x.name)}</div><div class="crest">${escapeHtml(x.restaurant||'')} · ID ${x.id}</div><div class="mini-reacts"><button class="yes" data-id="${x.id}" data-r="want">😍 想吃</button><button class="maybe" data-id="${x.id}" data-r="maybe">🙂 可以</button><button class="no" data-id="${x.id}" data-r="no">🙅 不想</button></div></div></article>`).join('')+`<div id="sentinel" class="sentinel">${state.done?'已經看到全部料理了':'繼續往下滑，還有更多料理…'}</div>`;feed.querySelectorAll('[data-r]').forEach(b=>b.onclick=e=>{e.stopPropagation();react(Number(b.dataset.id),b.dataset.r)});feed.querySelectorAll('.card').forEach(c=>c.onclick=e=>{if(e.target.closest('[data-r]'))return;state.current=Number(c.dataset.index);window.scrollTo({top:0,behavior:'smooth'});renderHero()});observeSentinel()}
let obs;function observeSentinel(){obs?.disconnect();const s=document.getElementById('sentinel');if(!s||state.done)return;obs=new IntersectionObserver(async es=>{if(es.some(e=>e.isIntersecting)){const before=state.items.length;await loadMore();if(state.items.length!==before)renderFeed()}},{rootMargin:'500px 0px'});obs.observe(s)}
function renderAll(){renderHero();renderFeed()}
let sx=0,sy=0;hero.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sx=t.screenX;sy=t.screenY},{passive:true});hero.addEventListener('touchend',async e=>{const t=e.changedTouches[0],dx=t.screenX-sx,dy=t.screenY-sy;if(Math.abs(dx)<45||Math.abs(dx)<Math.abs(dy))return;if(dx<0){if(state.current>=state.items.length-2&&!state.done)await loadMore();state.current=(state.current+1)%state.items.length}else state.current=(state.current-1+state.items.length)%state.items.length;renderAll()},{passive:true});
async function compress(file,max=900,q=.68){const url=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file)});const img=await new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.src=url});const scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',q);return {imageMime:'image/jpeg',imageBase64:data.split(',')[1],preview:data}}
let pending=null;photo.onchange=async()=>{if(!photo.files[0])return;pending=await compress(photo.files[0]);previewImg.src=pending.preview;preview.style.display='block'};
picker.innerHTML=CATS.filter(x=>x!=='全部').map(c=>`<label><input type="checkbox" value="${c}"><span>${c}</span></label>`).join('');
form.onsubmit=async e=>{e.preventDefault();formError.innerHTML='';try{if(!pending)throw new Error('請先選一張食物照片');const tags=[...picker.querySelectorAll('input:checked')].map(x=>x.value);await api('/api/foods',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:foodName.value.trim(),restaurant:restaurant.value.trim(),tags,imageMime:pending.imageMime,imageBase64:pending.imageBase64})});form.reset();pending=null;preview.style.display='none';await reset('全部');switchTab('dad')}catch(err){formError.innerHTML=`<div class="error">${escapeHtml(err.message)}</div>`}};
let pendingExisting=null;existingPhoto.onchange=async()=>{if(!existingPhoto.files[0])return;pendingExisting=await compress(existingPhoto.files[0]);existingPreviewImg.src=pendingExisting.preview;existingPreview.style.display='block'};
async function loadNeedsPhoto(){try{const all=showAll.checked;const d=await api('/api/foods/needs-photo'+(all?'?all=1':''));existingId.innerHTML=d.items.length?d.items.map(x=>`<option value="${x.id}">${x.has_photo?'📷 ':''}${escapeHtml(x.name)}${x.restaurant?' · '+escapeHtml(x.restaurant):''}</option>`).join(''):'<option value="">每道料理都有照片了 🎉</option>'}catch(e){existingId.innerHTML=`<option value="">${escapeHtml(e.message)}</option>`}}
showAll.onchange=loadNeedsPhoto;
updatePhoto.onclick=async()=>{try{const id=Number(existingId.value);if(!id)throw new Error('請先選一道料理');if(!pendingExisting)throw new Error('請先選一張照片');await api(`/api/foods/${id}/image`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(pendingExisting)});pendingExisting=null;existingPhoto.value='';existingPreview.style.display='none';await loadNeedsPhoto();await reset(state.filter);alert('照片已更新')}catch(e){alert(e.message)}};
async function loadStats(){try{const d=await api('/api/stats');sw.textContent=d.want;sm.textContent=d.maybe;sn.textContent=d.no}catch{}}
async function loadHistory(){try{const d=await api('/api/history');historyBox.innerHTML=d.items.length?d.items.map(x=>`<div class="history-item"><div class="history-top"><strong>${escapeHtml(x.name)}</strong><span>${reactionLabel[x.reaction]}</span></div><div class="small">${escapeHtml(x.restaurant||'')} · ${escapeHtml(x.created_at)}</div></div>`).join(''):'<div class="missing">還沒有紀錄。</div>'}catch(e){historyBox.innerHTML=`<div class="error">${escapeHtml(e.message)}</div>`}}
function switchTab(id){document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));if(id==='add'){loadStats();loadNeedsPhoto()}if(id==='history')loadHistory()}
async function loadRestaurants(){try{const d=await api('/api/restaurants');restSelect.innerHTML='<option value="">全部餐廳</option>'+d.items.map(x=>`<option value="${escapeHtml(x.restaurant)}">${escapeHtml(x.restaurant)}（${x.n}）</option>`).join('')}catch{}}
restSelect.onchange=()=>{state.restaurant=restSelect.value;reset(state.filter)};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));renderFilters();reset('全部');loadNeedsPhoto();loadRestaurants();
</script>
</body>
</html>
